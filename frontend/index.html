<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weapon Detection System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🔫</span>
                <h1>Weapon Detection System</h1>
            </div>
            <p class="subtitle">CoderAxo AI/ML Internship 2026</p>
        </header>

        <main>
            <div class="control-panel">
                <div class="source-toggle">
                    <button id="tabUpload" class="tab-btn active">Upload Image</button>
                    <button id="tabWebcam" class="tab-btn">Live Webcam</button>
                </div>

                <div class="upload-section" id="uploadSection">
                    <h2>Upload Image</h2>
                    <div class="drop-zone" id="dropZone">
                        <span class="drop-icon">📁</span>
                        <p>Drag & Drop or Click to Upload</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>
                </div>

                <div class="webcam-section hidden" id="webcamSection">
                    <h2>Live Webcam</h2>
                    <div class="webcam-container">
                        <video id="webcamVideo" autoplay playsinline muted class="hidden"></video>
                        <div id="webcamPlaceholder" class="placeholder-text">Click Start to use camera</div>
                    </div>
                    <button id="toggleWebcamBtn" class="primary-btn">Start Webcam</button>
                </div>
                
                <canvas id="captureCanvas" hidden></canvas>
                
                <div class="settings-section">
                    <h2>Settings</h2>
                    <div class="setting-item">
                        <label for="confThresh">Confidence Threshold: <span id="confVal">60%</span></label>
                        <input type="range" id="confThresh" min="0.1" max="0.9" step="0.05" value="0.6">
                    </div>
                    <button id="predictBtn" class="primary-btn" disabled>Detect Weapons</button>
                </div>
            </div>

            <div class="results-panel">
                <h2>Detection Results</h2>
                <div class="results-grid">
                    <div class="image-preview">
                        <div id="loading" class="hidden">
                            <div class="spinner"></div>
                            <p>Processing...</p>
                        </div>
                        <img id="outputImage" src="" alt="Detection Output" class="hidden">
                        <div id="placeholder" class="placeholder-text">Upload an image to start detection</div>
                    </div>
                    
                    <div class="metrics-sidebar">
                        <div class="metric-card">
                            <h3>🎯 Detections</h3>
                            <p id="detCount" class="metric-value">0</p>
                        </div>
                        <div class="metric-card">
                            <h3>⏱️ Inference Time</h3>
                            <p id="infTime" class="metric-value">0ms</p>
                        </div>
                        <div class="detections-list" id="detList">
                            <!-- Detection items will appear here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
